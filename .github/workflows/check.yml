name: Check site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        baseurl: ["", "/preview"]
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build with locked dependencies
        run: bundle exec jekyll build --strict_front_matter --baseurl '${{ matrix.baseurl }}'
      - name: Check pages, links, assets and redirects
        run: python scripts/check_site.py --baseurl '${{ matrix.baseurl }}'
