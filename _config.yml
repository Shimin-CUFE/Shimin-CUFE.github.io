title: Scripts
description: A collection of small utility scripts and tools.
locale: zh-CN
url: https://Shimin-CUFE.github.io
baseurl: ""
repository: Shimin-CUFE/Shimin-CUFE.github.io

include:
  - _pages
exclude:
  - .github
  - .bundle
  - .ruby-version
  - .dockerignore
  - .gitignore
  - CLAUDE.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - scripts
  - local
  - vendor
  - node_modules
  - "*.stackdump"

encoding: utf-8
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

sass:
  sass_dir: _sass
  style: compressed

timezone: Asia/Shanghai
plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
whitelist:
  - jekyll-redirect-from
  - jekyll-sitemap

redirect_from:
  json: false
